name: askSlim Trade Ideas Monitor

on:
  push:
    branches:
      - main
  schedule:
    # Runs every 5 minutes automatically 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      send_test:
        description: 'Send Telegram connection test message'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: askslim-trade-ideas-monitor
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Telegram Connection
        if: github.event_name == 'push' || github.event.inputs.send_test == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python telegram_notifier.py --test

      - name: Run Notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python telegram_notifier.py --once

      - name: Commit and push updated state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add notifier_state.json
          if [ -n "$(git status --porcelain notifier_state.json)" ]; then
            git commit -m "Auto-update trade ideas state [skip ci]"
            git pull --rebase origin main || git pull --rebase || true
            git push origin main || git push
          fi
